<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>format-bench — ten front-ends, one dataset</title>
<meta name="description" content="Ten complete, working front-ends over the same benchmark data. Switch between them live.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Ctext x='8' y='12' font-family='monospace' font-size='11' font-weight='700' fill='%23fff' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<style>
/* ══ shell ══════════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #0b0e14; color: #e6edf3; font: 15px/1.5 var(--sans); overflow-x: hidden; }
:root {
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
}
#app { min-height: 100vh; padding-bottom: 74px; }
#app.full { padding-bottom: 0; }          /* the embedded production page scrolls itself */
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* ══ floating switcher ══════════════════════════════════════════════════ */
#bar {
  position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); z-index: 9999;
  display: flex; align-items: center; gap: .6rem; max-width: calc(100vw - 1.5rem);
  padding: .4rem .7rem; border-radius: 999px;
  background: rgba(12,14,20,.86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.16); color: #e6edf3;
  font: 500 12px/1 var(--sans); box-shadow: 0 8px 28px rgba(0,0,0,.45);
}
#bar button, #bar a {
  background: none; border: 0; cursor: pointer; padding: 5px 7px; border-radius: 999px;
  text-decoration: none; color: inherit; line-height: 1;
}
#bar button:hover, #bar a:hover { background: rgba(255,255,255,.14); }
#bar .selwrap {
  display: flex; align-items: center; gap: 5px;
  border: 1px solid rgba(255,255,255,.24); border-radius: 999px; padding: 3px 9px 3px 11px;
}
#bar select {
  appearance: none; background: none; border: 0; color: inherit;
  font: 500 12px var(--sans); cursor: pointer; max-width: 40vw; padding: 0;
}
#bar select option { background: #12161f; color: #e6edf3; }
#bar .caret { font-size: 9px; opacity: .75; }
#bar .count { font-family: var(--mono); font-variant-numeric: tabular-nums; opacity: .7; }
#bar .sep { width: 1px; height: 15px; background: rgba(255,255,255,.2); }
#boot { display: grid; place-items: center; min-height: 100vh; font-family: var(--mono); font-size: 13px; opacity: .65; }

/* ══ primitives every app reuses (scoped by the app root's own vars) ════ */
.ap { --pad: clamp(16px, 3vw, 34px); min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font); }
.ap .wrap { max-width: 1280px; margin: 0 auto; padding: var(--pad); }
.ap h1, .ap h2, .ap h3 { margin: 0; line-height: 1.12; letter-spacing: -.02em; }
.ap .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ap .dim { opacity: .6; }
.ap .kbd { font: 600 10px var(--mono); border: 1px solid currentColor; border-radius: 3px; padding: 1px 4px; opacity: .55; }
.ap input, .ap select, .ap textarea {
  font: inherit; font-size: 13px; color: var(--ink); background: transparent;
  border: 1px solid color-mix(in oklab, var(--ink) 22%, transparent); border-radius: 7px; padding: 6px 9px;
}
.ap input::placeholder { color: color-mix(in oklab, var(--ink) 45%, transparent); }
.ap .btn {
  border: 1px solid color-mix(in oklab, var(--ink) 22%, transparent); background: transparent;
  border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
}
.ap .btn:hover { background: color-mix(in oklab, var(--ink) 8%, transparent); }
.ap .btn[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.ap pre {
  margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; white-space: pre-wrap;
  word-break: break-word; background: color-mix(in oklab, var(--ink) 5%, transparent);
  border: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); border-radius: 8px; padding: 10px 12px;
  overflow: auto;
}
.ap table { border-collapse: collapse; width: 100%; font-size: 13px; }
.ap th, .ap td { padding: 6px 9px; text-align: right; white-space: nowrap; }
.ap th:first-child, .ap td:first-child { text-align: left; }
.ap tbody tr { border-top: 1px solid color-mix(in oklab, var(--ink) 12%, transparent); }
.ap .scroll { overflow: auto; }
.ap .load { padding: 40px; text-align: center; font-family: var(--mono); font-size: 12px; opacity: .6; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="boot">loading benchmark data…</div>
<div id="app" hidden></div>

<nav id="bar" hidden aria-label="Front-end switcher">
  <button id="prev" title="Previous (←)" aria-label="Previous front-end">‹</button>
  <span class="selwrap">
    <select id="jump" aria-label="Choose a front-end"></select>
    <span class="caret" aria-hidden="true">▾</span>
  </span>
  <span class="count" id="count"></span>
  <button id="next" title="Next (→)" aria-label="Next front-end">›</button>
  <span class="sep"></span>
  <a href="index.html" title="The production leaderboard">Live site</a>
</nav>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (tag, attrs = {}, html) => { const n = document.createElement(tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (html != null) n.innerHTML = html; return n; };
const pretty = (v) => typeof v === "string" ? v : JSON.stringify(v, null, 2);
const SVGNS = "http://www.w3.org/2000/svg";
const svgEl = (t, a = {}) => { const n = document.createElementNS(SVGNS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };

/* ══ data ═══════════════════════════════════════════════════════════════ */
let META, BOARD, CASES, BYID;
const MODELS = new Map();                  // slug → Map(caseId → {p,e})   (lazy)

async function loadModel(slug) {
  if (MODELS.has(slug)) return MODELS.get(slug);
  const p = fetch(`data/models/${slug}.json`).then((r) => r.json())
    .then((d) => new Map(d.rows.map((r) => [r.id, r])))
    .catch(() => new Map());
  MODELS.set(slug, p);
  return p;
}
/** Every model's verdicts. Needed by the case-level apps; ~7 MB, so it reports progress. */
async function loadAll(onProgress) {
  let done = 0;
  await Promise.all(BOARD.map(async (m) => { await loadModel(m.slug); onProgress?.(++done, BOARD.length); }));
}
const T = (v) => !!(v & 2);                // bitfield: 2 = task, 1 = strict
const S = (v) => !!(v & 1);

const fmtSize = (m) => m.params == null ? "—"
  : m.params >= 1e6 ? +(m.params / 1e6).toFixed(1) + "T"
  : m.params >= 1000 ? +(m.params / 1000).toFixed(m.params % 1000 ? 1 : 0) + "B"
  : m.params + "M";
const best = (m) => Math.max(m.plain.task, m.ex.task);
const dirLabel = (d) => d.replace(">", " → ");

/* ══ apps ═══════════════════════════════════════════════════════════════ */
const APPS = [];
const app = (o) => APPS.push(o);

/* ─── 00 · Production ─────────────────────────────────────────────────────
   The live leaderboard, shown as itself rather than reimplemented — it is the
   page these ten are alternatives to, so it belongs in the comparison. */
app({
  slug: "production", name: "Production site (live)",
  bg: "#fbfbf9", ink: "#0b0b0b", accent: "#2a78d6", font: "var(--sans)",
  full: true,
  css: `
    .a-production { padding: 0; }
    .a-production iframe { display: block; width: 100%; height: calc(100vh - 4px); border: 0; }
  `,
  async mount(root) {
    root.innerHTML = `<iframe src="index.html" title="format-bench leaderboard" loading="eager"></iframe>`;
  },
});

/* ─── 01 · Matrix Console ─────────────────────────────────────────────── */
app({
  slug: "matrix", name: "Matrix Console",
  bg: "#0d1117", ink: "#e6edf3", accent: "#2dd4bf", font: "var(--mono)",
  css: `
    .a-matrix .grid { display: grid; gap: 22px; grid-template-columns: minmax(0,1fr) 340px; align-items: start; }
    @media (max-width: 1000px) { .a-matrix .grid { grid-template-columns: 1fr; } }
    .a-matrix .hm { border-collapse: separate; border-spacing: 2px; font-size: 11px; }
    .a-matrix .hm th { font: 600 9.5px var(--mono); opacity: .6; padding: 0 0 6px; text-align: center; }
    .a-matrix .hm td.m { text-align: left; white-space: nowrap; padding-right: 8px; font-size: 11.5px; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
    .a-matrix .cell { text-align: center; padding: 5px 0; border-radius: 3px; cursor: pointer; font: 600 10px var(--mono); }
    .a-matrix .cell:hover { outline: 2px solid var(--accent); }
    .a-matrix .side { position: sticky; top: 16px; border: 1px solid #ffffff1f; border-radius: 10px; padding: 14px; }
    .a-matrix .caselist { max-height: 46vh; overflow: auto; margin-top: 10px; }
    .a-matrix .caselist button { display: block; width: 100%; text-align: left; background: none; border: 0;
      border-bottom: 1px solid #ffffff12; padding: 6px 4px; cursor: pointer; font: 11px var(--mono); }
    .a-matrix .caselist button:hover { background: #ffffff0d; }
  `,
  async mount(root) {
    const top = BOARD.slice(0, 24);
    const ramp = ["#0d2b3a", "#12455c", "#136b7f", "#12909b", "#1cb5ae", "#4ad6c4", "#8bead9"];
    const col = (v) => v == null ? "#1b222b" : ramp[Math.min(6, Math.floor(v / 100 * 7))];
    const ink = (v) => (v ?? 0) >= 58 ? "#06202a" : "#cfe9e6";
    root.innerHTML = `<div class="wrap">
      <h2 style="font-size:1.35rem">Where models break</h2>
      <p class="dim" style="max-width:62ch;margin:8px 0 20px;font-size:13px">
        Task score per direction. Click any cell to list that model's failures there. Nine columns, ${BOARD.length} models —
        the grid is the entry point, not a ranking.</p>
      <div class="grid">
        <div class="scroll"><table class="hm"><thead><tr><th></th>
          ${META.directions.map((d) => `<th>${d.replace(">", "→")}</th>`).join("")}</tr></thead><tbody>
          ${top.map((m) => `<tr><td class="m" title="${esc(m.name)}">${esc(m.model)}</td>
            ${META.directions.map((d) => {
              const v = Math.max(m.ex.dir[d] ?? -1, m.plain.dir[d] ?? -1);
              const val = v < 0 ? null : v;
              return `<td class="cell" style="background:${col(val)};color:${ink(val)}"
                data-slug="${m.slug}" data-dir="${d}">${val ?? "—"}</td>`;
            }).join("")}</tr>`).join("")}
        </tbody></table></div>
        <div class="side" id="mx-side"><div class="dim" style="font-size:12px">Pick a cell →</div></div>
      </div></div>`;

    const side = $("#mx-side", root);
    root.addEventListener("click", async (e) => {
      const c = e.target.closest(".cell"); if (!c) return;
      const { slug, dir } = c.dataset;
      const m = BOARD.find((x) => x.slug === slug);
      side.innerHTML = `<div class="load">loading ${esc(m.model)}…</div>`;
      const v = await loadModel(slug);
      const [from, to] = dir.split(">");
      const inDir = CASES.filter((x) => x.from === from && x.to === to);
      const failed = inDir.filter((x) => { const r = v.get(x.id); return r && !T(r.e) && !T(r.p); });
      const byChal = {};
      for (const ch of META.challenges) {
        const sub = inDir.filter((x) => x.challenges.includes(ch.key));
        const ok = sub.filter((x) => { const r = v.get(x.id); return r && (T(r.e) || T(r.p)); }).length;
        if (sub.length) byChal[ch.key] = [ok, sub.length];
      }
      side.innerHTML = `
        <div style="font-size:12.5px"><b>${esc(m.model)}</b><br><span class="dim">${dirLabel(dir)}</span></div>
        <div class="mono" style="margin:10px 0;font-size:12px">
          ${inDir.length - failed.length} passed · <span style="color:#ff7b72">${failed.length} failed</span></div>
        <div style="font-size:11px" class="mono">
          ${Object.entries(byChal).map(([k, [a, b]]) =>
            `<div style="display:flex;justify-content:space-between;gap:8px"><span class="dim">${k}</span><span>${a}/${b}</span></div>`).join("")}
        </div>
        <div class="dim" style="margin-top:12px;font-size:10px;letter-spacing:.1em">FAILED CASES</div>
        <div class="caselist">${failed.slice(0, 200).map((x) =>
          `<button data-case="${x.id}">${x.id} <span class="dim">L${x.level} ${x.challenges.join(",") || "—"}</span></button>`).join("")
          || '<div class="dim" style="padding:8px 0;font-size:11px">none — clean sweep</div>'}</div>
        <div id="mx-case" style="margin-top:10px"></div>`;
      $$(".caselist button", side).forEach((b) => b.onclick = () => {
        const x = BYID.get(b.dataset.case);
        $("#mx-case", side).innerHTML =
          `<div class="dim" style="font-size:10px;letter-spacing:.1em;margin-bottom:5px">INPUT</div><pre>${esc(x.input)}</pre>
           <div class="dim" style="font-size:10px;letter-spacing:.1em;margin:8px 0 5px">EXPECTED</div><pre>${esc(pretty(x.expected))}</pre>`;
      });
    });
  },
});

/* ─── 02 · Case Reader ────────────────────────────────────────────────── */
app({
  slug: "reader", name: "Case Reader",
  bg: "#f6f3ec", ink: "#1f1c18", accent: "#b5502a", font: "var(--serif)",
  css: `
    .a-reader .grid { display: grid; grid-template-columns: 290px minmax(0,1fr) 250px; gap: 0; border: 1px solid #1f1c1826; border-radius: 12px; overflow: hidden; }
    @media (max-width: 1060px) { .a-reader .grid { grid-template-columns: 1fr; } }
    .a-reader .list { border-right: 1px solid #1f1c1826; max-height: 74vh; overflow: auto; }
    .a-reader .list button { display: block; width: 100%; text-align: left; background: none; border: 0;
      border-bottom: 1px solid #1f1c1814; padding: 9px 13px; cursor: pointer; }
    .a-reader .list button:hover { background: #1f1c180a; }
    .a-reader .list button[aria-current="true"] { background: #b5502a14; box-shadow: inset 3px 0 0 var(--accent); }
    .a-reader .doc { padding: 20px 24px; max-height: 74vh; overflow: auto; }
    .a-reader .who { border-left: 1px solid #1f1c1826; padding: 14px; max-height: 74vh; overflow: auto; font-family: var(--sans); }
    .a-reader h4 { font: 600 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; opacity: .55; margin: 18px 0 7px; }
    .a-reader h4:first-child { margin-top: 0; }
    .a-reader .chip { display: inline-block; font: 600 10px var(--mono); border: 1px solid var(--accent); color: var(--accent);
      border-radius: 999px; padding: 2px 7px; margin: 0 4px 4px 0; }
    .a-reader .vrow { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #1f1c180f; }
  `,
  async mount(root) {
    root.innerHTML = `<div class="wrap">
      <h2 style="font-size:1.5rem">The case is the subject</h2>
      <p class="dim" style="max-width:60ch;margin:8px 0 18px;font-size:14px">
        All ${CASES.length.toLocaleString()} cases, each with its rules, its data, its reference answer, and every model's verdict.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-family:var(--sans)">
        <select id="rd-dir"><option value="">Any direction</option>${META.directions.map((d) => `<option value="${d}">${dirLabel(d)}</option>`).join("")}</select>
        <select id="rd-ch"><option value="">Any constraint</option>${META.challenges.map((c) => `<option value="${c.key}">${c.key}</option>`).join("")}</select>
        <select id="rd-lv"><option value="">Any level</option>${META.levels.map((l) => `<option value="${l.n}">L${l.n} · ${l.label}</option>`).join("")}</select>
        <input id="rd-q" type="search" placeholder="case id…" style="width:130px">
        <span class="dim mono" id="rd-n" style="align-self:center;font-size:12px"></span>
      </div>
      <div class="grid">
        <div class="list" id="rd-list"></div>
        <div class="doc" id="rd-doc"></div>
        <div class="who" id="rd-who"></div>
      </div></div>`;

    let cur = null, allLoaded = false;
    const filt = () => {
      const d = $("#rd-dir", root).value, c = $("#rd-ch", root).value,
            l = $("#rd-lv", root).value, q = $("#rd-q", root).value.trim().toLowerCase();
      return CASES.filter((x) => (!d || `${x.from}>${x.to}` === d) && (!c || x.challenges.includes(c)) &&
        (!l || String(x.level) === l) && (!q || x.id.includes(q)));
    };
    const renderList = () => {
      const rows = filt();
      $("#rd-n", root).textContent = `${rows.length} cases`;
      $("#rd-list", root).innerHTML = rows.slice(0, 300).map((x) => `
        <button data-id="${x.id}" aria-current="${x.id === cur}">
          <div class="mono" style="font-size:10.5px;opacity:.55">${x.id} · L${x.level} · ${x.difficulty}</div>
          <div style="font-size:13px;margin-top:1px">${x.from} → ${x.to} <span class="dim">${x.domain}</span></div>
        </button>`).join("");
      $$("#rd-list button", root).forEach((b) => b.onclick = () => show(b.dataset.id));
      if (rows.length && !rows.some((x) => x.id === cur)) show(rows[0].id);
    };
    async function show(id) {
      cur = id;
      $$("#rd-list button", root).forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === id)));
      const x = BYID.get(id);
      $("#rd-doc", root).innerHTML = `
        <div class="mono" style="font-size:11px;opacity:.55">${x.id}</div>
        <div style="margin:8px 0 12px">${x.challenges.map((c) => `<span class="chip">${c}</span>`).join("") || '<span class="dim" style="font-size:12px">no constraints</span>'}</div>
        <h4>Rules</h4><pre>${esc(x.instructions)}</pre>
        <h4>Input · ${x.from}</h4><pre>${esc(x.input)}</pre>
        <h4>Expected · ${x.to}</h4><pre>${esc(pretty(x.expected))}</pre>`;
      const who = $("#rd-who", root);
      if (!allLoaded) {
        who.innerHTML = `<div class="load" id="rd-prog">loading verdicts…</div>`;
        await loadAll((d, t) => { const p = $("#rd-prog", root); if (p) p.textContent = `loading verdicts ${d}/${t}`; });
        allLoaded = true;
      }
      const rows = await Promise.all(BOARD.map(async (m) => ({ m, r: (await loadModel(m.slug)).get(id) })));
      const pass = rows.filter(({ r }) => r && (T(r.p) || T(r.e))).length;
      who.innerHTML = `<div style="font-size:12px"><b>${pass}</b> of ${rows.length} models solved it</div>
        <div style="height:6px;border-radius:999px;background:#1f1c1818;margin:8px 0 12px">
          <div style="height:6px;border-radius:999px;width:${(pass / rows.length * 100).toFixed(0)}%;background:var(--accent)"></div></div>
        ${rows.map(({ m, r }) => `<div class="vrow"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.model)}</span>
          <span class="mono" style="color:${r && (T(r.p) || T(r.e)) ? "#1f7a4d" : "#b4433f"}">${r ? (T(r.p) ? "✓" : "·") + (T(r.e) ? "✓" : "·") : "—"}</span></div>`).join("")}
        <div class="dim mono" style="margin-top:10px;font-size:10px">left = plain · right = explained</div>`;
    }
    $$("#rd-dir,#rd-ch,#rd-lv", root).forEach((s) => s.onchange = renderList);
    $("#rd-q", root).oninput = renderList;
    renderList();
  },
});

/* ─── 03 · Head-to-Head ───────────────────────────────────────────────── */
app({
  slug: "arena", name: "Head-to-Head",
  bg: "#101828", ink: "#e8edf7", accent: "#f5a623", font: "var(--sans)",
  css: `
    .a-arena .pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    .a-arena .stats { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 12px; margin-bottom: 22px; }
    .a-arena .stat { border: 1px solid #ffffff1c; border-radius: 10px; padding: 13px 15px; }
    .a-arena .stat b { display: block; font: 700 1.6rem var(--mono); }
    .a-arena .stat span { font-size: 11px; opacity: .6; }
    .a-arena .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 860px) { .a-arena .cmp { grid-template-columns: 1fr; } }
    .a-arena .clist { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; }
    .a-arena .clist button { border: 1px solid #ffffff22; background: none; border-radius: 6px; padding: 3px 7px;
      font: 10.5px var(--mono); cursor: pointer; }
    .a-arena .clist button:hover, .a-arena .clist button[aria-pressed="true"] { background: var(--accent); color: #101828; border-color: var(--accent); }
  `,
  async mount(root) {
    const opts = (sel) => BOARD.map((m) => `<option value="${m.slug}" ${m.slug === sel ? "selected" : ""}>${esc(m.model)} · ${best(m)}</option>`).join("");
    let A = BOARD[3]?.slug ?? BOARD[0].slug, B = BOARD[7]?.slug ?? BOARD[1].slug;
    root.innerHTML = `<div class="wrap">
      <h2 style="font-size:1.4rem">Two models, one diff</h2>

        <div class="cmp" id="ar-detail"></div>`;
      $$("#ar-cases button", root).forEach((b) => b.onclick = () => {
        $$("#ar-cases button", root).forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        const c = BYID.get(b.dataset.id);
        const ra = va.get(c.id), rb = vb.get(c.id);
        const badge = (r) => r ? `<span class="mono" style="color:${T(r.p) || T(r.e) ? "#4ade80" : "#f87171"}">${T(r.p) ? "plain ✓" : "plain ✗"} · ${T(r.e) ? "ex ✓" : "ex ✗"}</span>` : "—";

            <div class="dim mono" style="font-size:10px;margin-bottom:4px">EXPECTED · ${c.to}</div><pre>${esc(pretty(c.expected))}</pre></div>`;

/* ─── 04 · Frontier ───────────────────────────────────────────────────── */
app({
  slug: "frontier", name: "Frontier",
  bg: "#fbfbfd", ink: "#111018", accent: "#6039e0", font: "var(--sans)",
  css: `
    .a-frontier .layout { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 20px; align-items: start; }
    @media (max-width: 980px) { .a-frontier .layout { grid-template-columns: 1fr; } }
    .a-frontier .panel { border: 1px solid #1110181f; border-radius: 12px; padding: 16px; position: sticky; top: 16px; }
    .a-frontier .dot { cursor: pointer; }
    .a-frontier .dot:hover { stroke: #111018; stroke-width: 2; }
    .a-frontier .tag { font: 600 10px var(--mono); }
  `,
  async mount(root) {
    const pts = BOARD.filter((m) => m.params != null).map((m) => ({ m, x: Math.log10(m.params), y: best(m) }));
    // Pareto edge: nothing smaller scores higher.
    const front = [...pts].sort((a, b) => a.x - b.x).filter((p, i, arr) => !arr.some((q, j) => j !== i && q.x <= p.x && q.y > p.y));
    root.innerHTML = `<div class="wrap">
      <h2 style="font-size:1.5rem">Capability per parameter</h2>
      <p class="dim" style="max-width:60ch;margin:8px 0 20px;font-size:13.5px">
        Every model with a disclosed size. The line is the Pareto frontier — on it, nothing smaller scores higher.
        ${front.length} of ${pts.length} models are on it.</p>
      <div class="layout">
        <div><svg id="fr-svg" viewBox="0 0 760 380" style="width:100%;height:auto"></svg>
          <div class="dim" style="font-size:11.5px;margin-top:6px">↖ upper-left is better — smaller model, higher score</div></div>
        <div class="panel" id="fr-side"><div class="dim" style="font-size:12px">Hover or click a point.</div></div>
      </div></div>`;
    const svg = $("#fr-svg", root);
    const P = { l: 46, r: 14, t: 16, b: 40 }, W = 760, H = 380;
    const xs = pts.map((p) => p.x), x0 = Math.min(...xs) - .15, x1 = Math.max(...xs) + .15;
    const X = (v) => P.l + (v - x0) / (x1 - x0) * (W - P.l - P.r);
    const Y = (v) => H - P.b - v / 100 * (H - P.t - P.b);
    for (let g = 0; g <= 100; g += 20) {
      svg.append(svgEl("line", { x1: P.l, x2: W - P.r, y1: Y(g), y2: Y(g), stroke: "#11101814" }));
      const t = svgEl("text", { x: P.l - 8, y: Y(g) + 4, "text-anchor": "end", "font-size": 10, fill: "#11101888", "font-family": "var(--mono)" });
      t.textContent = g; svg.append(t);
    }
    for (const tick of [100, 1000, 10000, 100000, 1000000]) {
      const lx = Math.log10(tick); if (lx < x0 || lx > x1) continue;
      svg.append(svgEl("line", { x1: X(lx), x2: X(lx), y1: P.t, y2: H - P.b, stroke: "#11101810" }));
      const t = svgEl("text", { x: X(lx), y: H - P.b + 17, "text-anchor": "middle", "font-size": 10, fill: "#11101888", "font-family": "var(--mono)" });
      t.textContent = tick >= 1e6 ? tick / 1e6 + "T" : tick >= 1000 ? tick / 1000 + "B" : tick + "M"; svg.append(t);
    }
    const path = front.map((p, i) => `${i ? "L" : "M"}${X(p.x)} ${Y(p.y)}`).join(" ");
    svg.append(svgEl("path", { d: path, fill: "none", stroke: "#6039e0", "stroke-width": 1.6, "stroke-dasharray": "6 4", opacity: .8 }));
    const side = $("#fr-side", root);
    const show = (p) => {
      const m = p.m, onFront = front.includes(p);
      side.innerHTML = `<div style="font-size:13px"><b>${esc(m.model)}</b></div>
        <div class="dim mono" style="font-size:11px;margin-top:2px">${esc(m.provider)}</div>
        <div class="mono" style="margin:10px 0;font-size:12px">
          ${esc(m.sizeLabel)}${m.active ? ` · ${esc(m.active)} active` : ""}<br>
          task ${m.plain.task} plain → ${m.ex.task} explained<br>
          strict ${m.plain.strict} → ${m.ex.strict}</div>
        ${onFront ? '<div style="font:600 10px var(--mono);color:var(--accent)">◆ ON THE FRONTIER</div>' : ""}
        <div style="font:600 9.5px var(--mono);letter-spacing:.1em;opacity:.5;margin:12px 0 5px">BY DIRECTION</div>
        ${META.directions.map((d) => { const v = Math.max(m.ex.dir[d] ?? 0, m.plain.dir[d] ?? 0);
          return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            <span class="mono dim" style="font-size:10px;width:74px">${dirLabel(d)}</span>
            <span style="flex:1;height:5px;border-radius:999px;background:#11101814">
              <span style="display:block;height:5px;border-radius:999px;width:${v}%;background:var(--accent)"></span></span>
            <span class="mono" style="font-size:10px;width:18px;text-align:right">${v}</span></div>`; }).join("")}`;
    };
    for (const p of pts) {
      const c = svgEl("circle", { class: "dot", cx: X(p.x), cy: Y(p.y), r: front.includes(p) ? 6.5 : 5,
        fill: front.includes(p) ? "#6039e0" : "#9d8ae8", stroke: "#fbfbfd", "stroke-width": 2 });
      c.addEventListener("mouseenter", () => show(p));
      c.addEventListener("click", () => show(p));
      svg.append(c);
    }
    for (const p of front) {
      const t = svgEl("text", { class: "tag", x: X(p.x), y: Y(p.y) - 12, "text-anchor": "middle", "font-size": 9.5, fill: "#111018bb" });
      t.textContent = p.m.model.length > 18 ? p.m.model.slice(0, 17) + "…" : p.m.model; svg.append(t);
    }
    show(front.at(-1) ?? pts[0]);
  },
});

app({
  slug: "tty", name: "Terminal",
  bg: "#24273a", ink: "#cad3f5", accent: "#c6a0f6", font: "var(--mono)",
  css: `
    .a-tty .term { border: 1px solid #c6a0f644; border-radius: 10px; padding: 16px 18px; font-size: 12.5px;
      line-height: 1.7; min-height: 66vh; max-height: 78vh; overflow: auto; }
    .a-tty .line { white-space: pre-wrap; }
    .a-tty .in { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .a-tty .in input { flex: 1; border: 0; background: none; padding: 0; font: 12.5px var(--mono); color: var(--ink); outline: none; }
    .a-tty .ps { color: var(--accent); }
    .a-tty .hint { font-size: 11px; opacity: .5; margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  `,
  async mount(root) {
    root.innerHTML = `<div class="wrap">
      <div class="term" id="tt-term"></div>
      <div class="hint">
        <span><b>board</b> [--dir d] [--local|--hosted] [--top n]</span>
        <span><b>model</b> &lt;name&gt;</span><span><b>case</b> &lt;id&gt;</span>
        <span><b>dirs</b></span><span><b>chal</b></span><span><b>help</b></span><span><b>clear</b></span>
      </div></div>`;
    const term = $("#tt-term", root);
    const hist = []; let hi = 0;
    const write = (html) => { term.insertAdjacentHTML("beforeend", `<div class="line">${html}</div>`); term.scrollTop = term.scrollHeight; };
    const prompt = () => {
      const row = el("div", { class: "in" });
      row.innerHTML = `<span class="ps">❯</span>`;
      const inp = el("input", { spellcheck: "false", "aria-label": "command" });
      row.append(inp); term.append(row); inp.focus();
      inp.onkeydown = (e) => {
        if (e.key === "Enter") {
          const v = inp.value.trim(); row.remove();
          write(`<span class="ps">❯</span> ${esc(v)}`);
          if (v) { hist.push(v); hi = hist.length; run(v); }
          prompt();
        } else if (e.key === "ArrowUp") { e.preventDefault(); if (hi > 0) inp.value = hist[--hi] ?? ""; }
        else if (e.key === "ArrowDown") { e.preventDefault(); if (hi < hist.length - 1) inp.value = hist[++hi] ?? ""; else { hi = hist.length; inp.value = ""; } }
      };
      term.onclick = (e) => { if (!e.target.closest("button")) inp.focus(); };
    };
    const pad = (s, n) => String(s).padEnd(n).slice(0, n);
    function run(cmd) {
      const [c, ...rest] = cmd.split(/\s+/);
      const arg = (f) => { const i = rest.indexOf(f); return i >= 0 ? rest[i + 1] : null; };
      if (c === "help") return write(`  <b>board</b>  leaderboard; --dir <dir> --local --hosted --top <n>
  <b>model</b>  &lt;substring&gt;  full breakdown for one model
  <b>case</b>   &lt;id&gt;         one test case with its rules and answer
  <b>dirs</b>   average score per direction
  <b>chal</b>   cost of each constraint
  <b>clear</b>  wipe the screen`);
      if (c === "clear") { term.innerHTML = ""; return; }
      if (c === "dirs") {
        const rows = META.directions.map((d) => ({ d, v: BOARD.reduce((s, m) => s + Math.max(m.ex.dir[d] ?? 0, m.plain.dir[d] ?? 0), 0) / BOARD.length })).sort((a, b) => b.v - a.v);
        return write(rows.map((r) => `  ${pad(dirLabel(r.d), 14)} <span style="color:var(--accent)">${r.v.toFixed(1)}</span>`).join("\n"));
      }
      if (c === "chal") {
        const avg = (f) => { const v = BOARD.map(f).filter((x) => x != null); return v.reduce((a, b) => a + b, 0) / v.length; };
        const base = avg((m) => m.plain.noChallenge);
        const rows = META.challenges.map((x) => ({ k: x.key, v: avg((m) => m.plain.challenge[x.key]) })).sort((a, b) => a.v - b.v);
        return write(`  baseline (no constraint)  <span style="color:var(--accent)">${base.toFixed(1)}</span>\n` +
          rows.map((r) => `  ${pad(r.k, 10)} ${pad(r.v.toFixed(1), 6)} <span style="opacity:.6">${(r.v - base).toFixed(1)}</span>`).join("\n"));
      }
      if (c === "board") {
        let rows = [...BOARD];
        if (rest.includes("--local")) rows = rows.filter((m) => m.local);
        if (rest.includes("--hosted")) rows = rows.filter((m) => !m.local);
        const d = arg("--dir");
        if (d) {
          if (!META.directions.includes(d)) return write(`  <span style="color:#ed8796">unknown direction '${esc(d)}' — try: ${META.directions.join(" ")}</span>`);
          rows.sort((a, b) => Math.max(b.ex.dir[d] ?? 0, b.plain.dir[d] ?? 0) - Math.max(a.ex.dir[d] ?? 0, a.plain.dir[d] ?? 0));
        } else rows.sort((a, b) => best(b) - best(a));
        const n = parseInt(arg("--top") ?? "12", 10);
        return write(rows.slice(0, n).map((m, i) =>
          `  ${pad(i + 1, 3)} ${pad(m.model, 40)} ${pad(fmtSize(m), 7)} <span style="color:var(--accent)">${d ? Math.max(m.ex.dir[d] ?? 0, m.plain.dir[d] ?? 0) : best(m)}</span>`).join("\n"));
      }
      if (c === "model") {
        const q = rest.join(" ").toLowerCase();
        const m = BOARD.find((x) => x.name.toLowerCase().includes(q));
        if (!m) return write(`  <span style="color:#ed8796">no model matching '${esc(q)}'</span>`);
        return write(`  <b>${esc(m.name)}</b>   ${esc(m.sizeLabel)}${m.active ? ` (${esc(m.active)} active)` : ""}  ${m.local ? "local" : "hosted"}
  task    plain ${m.plain.task}   explained ${m.ex.task}   Δ ${m.delta > 0 ? "+" : ""}${m.delta}
  strict  plain ${m.plain.strict}   explained ${m.ex.strict}
  enum-excluded ${m.plain.noEnum}
` + META.directions.map((d) => `  ${pad(dirLabel(d), 14)} ${pad(m.plain.dir[d] ?? "—", 5)} ${m.ex.dir[d] ?? "—"}`).join("\n"));
      }
      if (c === "case") {
        const x = BYID.get(rest[0]);
        if (!x) return write(`  <span style="color:#ed8796">no case '${esc(rest[0] ?? "")}' — ids look like test-00001</span>`);
        return write(`  <b>${x.id}</b>  ${x.from} → ${x.to}  L${x.level}  ${x.domain}  [${x.challenges.join(", ") || "no constraints"}]

<span style="opacity:.6">  rules</span>
${x.instructions.split("\n").map((l) => "    " + esc(l)).join("\n")}
<span style="opacity:.6">  input</span>
${x.input.split("\n").map((l) => "    " + esc(l)).join("\n")}
<span style="opacity:.6">  expected</span>
${pretty(x.expected).split("\n").map((l) => "    " + esc(l)).join("\n")}`);
      }
      write(`  <span style="color:#ed8796">unknown command '${esc(c)}' — try help</span>`);
    }
    write(`<b style="color:var(--accent)">format-bench</b> ${BOARD.length} models · ${CASES.length.toLocaleString()} cases · dataset ${META.datasetSha.slice(0, 12)}
type <b>help</b> for commands, ↑/↓ for history\n`);
    run("board --top 8");
    prompt();
  },
});

/* ─── 08 · Workbench ──────────────────────────────────────────────────── */
app({
  slug: "workbench", name: "Workbench",
  bg: "#16181d", ink: "#dfe3ea", accent: "#7ee787", font: "var(--mono)",
  css: `

    .a-workbench .vr { display: flex; justify-content: space-between; gap: 6px; font-size: 10.5px; padding: 2px 0; }

        <select id="wb-filter"><option value="fail">failures only</option><option value="all">all cases</option><option value="pass">passes only</option></select>
      </div>
      <div class="ide"><div class="tree" id="wb-tree"></div><div class="editor" id="wb-ed"></div><div class="rail" id="wb-rail"></div></div>
      <div class="dim" style="font-size:11px;margin-top:8px">left: cases grouped by direction · middle: rules, input, expected · right: how every model did</div>
    </div>`;
    let cur = null;
    async function build() {
      const slug = $("#wb-model", root).value, mode = $("#wb-filter", root).value;
      const v = await loadModel(slug);
      const keep = (c) => { const r = v.get(c.id); if (!r) return false;
        const ok = T(r.p) || T(r.e); return mode === "all" || (mode === "fail" ? !ok : ok); };
      const groups = {};
      for (const c of CASES) if (keep(c)) (groups[`${c.from}>${c.to}`] ??= []).push(c);
      $("#wb-tree", root).innerHTML = Object.entries(groups).map(([d, cs]) =>
        `<div class="grp">${dirLabel(d)} (${cs.length})</div>` +
        cs.slice(0, 60).map((c) => `<button data-id="${c.id}" aria-current="${c.id === cur}">${c.id}
          <span class="dim">L${c.level}</span></button>`).join("")).join("")
        || '<div class="grp">nothing matches</div>';
      $$("#wb-tree button", root).forEach((b) => b.onclick = () => open(b.dataset.id));
      const first = $("#wb-tree button", root);

      else { $("#wb-ed", root).innerHTML = ""; $("#wb-rail", root).innerHTML = ""; }
    }

      cur = id;
      $$("#wb-tree button", root).forEach((b) => b.setAttribute("aria-current", String(b.dataset.id === id)));
      const c = BYID.get(id); if (!c) return;
      const slug = $("#wb-model", root).value;

      const mark = (b) => b == null ? "—" : `<span style="color:${T(b) ? "var(--accent)" : "#f87171"}">${T(b) ? "task ✓" : "task ✗"}${S(b) ? " strict ✓" : ""}</span>`;
      $("#wb-ed", root).innerHTML = `
        <div class="tabs"><button aria-selected="true">${id}</button>
          <span style="margin-left:auto;font:11px var(--mono);align-self:center">plain ${mark(r?.p)} · explained ${mark(r?.e)}</span></div>
        <div class="dim" style="font-size:10px;letter-spacing:.1em;margin:6px 0 5px">RULES</div><pre>${esc(c.instructions)}</pre>
        <div class="dim" style="font-size:10px;letter-spacing:.1em;margin:12px 0 5px">INPUT · ${c.from}</div><pre>${esc(c.input)}</pre>
        <div class="dim" style="font-size:10px;letter-spacing:.1em;margin:12px 0 5px">EXPECTED · ${c.to}</div><pre>${esc(pretty(c.expected))}</pre>`;
      const rail = $("#wb-rail", root);
      rail.innerHTML = `<div class="load">…</div>`;
      await loadAll();
      const all = await Promise.all(BOARD.map(async (m) => ({ m, r: (await loadModel(m.slug)).get(id) })));
      const n = all.filter(({ r: x }) => x && (T(x.p) || T(x.e))).length;
      rail.innerHTML = `<div class="dim" style="font-size:10px;letter-spacing:.1em;margin-bottom:7px">${n}/${BOARD.length} SOLVED</div>` +
        all.map(({ m, r: x }) => `<div class="vr"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:${m.slug === slug ? 1 : .62}">
          ${m.slug === slug ? "▸ " : ""}${esc(m.model)}</span>
          <span style="color:${x && (T(x.p) || T(x.e)) ? "var(--accent)" : "#f87171"}">${x ? (T(x.p) ? "✓" : "·") + (T(x.e) ? "✓" : "·") : "—"}</span></div>`).join("");
    }
    $("#wb-model", root).onchange = build;
    $("#wb-filter", root).onchange = build;
    build();
  },
});

/* ─── 09 · Constraint Dials ───────────────────────────────────────────── */
app({
  slug: "dials", name: "Constraint Dials",
  bg: "#ffffff", ink: "#16121c", accent: "#d6249f", font: "var(--sans)",
  css: `
    .a-dials .toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .a-dials .tg { display: flex; align-items: center; gap: 8px; border: 1px solid #16121c2e; background: none;
      border-radius: 999px; padding: 7px 14px; cursor: pointer; }
    .a-dials .tg[aria-pressed="true"] { border-color: var(--accent); background: #d6249f12; }
    .a-dials .sw { width: 26px; height: 15px; border-radius: 999px; background: #16121c26; position: relative; flex: none; }
    .a-dials .tg[aria-pressed="true"] .sw { background: var(--accent); }
    .a-dials .sw i { position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 999px; background: #fff; transition: left .15s; }
    .a-dials .tg[aria-pressed="true"] .sw i { left: 13px; }
    .a-dials .layout { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,.85fr); gap: 22px; align-items: start; }
    @media (max-width: 940px) { .a-dials .layout { grid-template-columns: 1fr; } }
  `,
  async mount(root) {
    const on = new Set(META.challenges.map((c) => c.key));
    let dirSel = "", loaded = false;
    root.innerHTML = `<div class="wrap">
      <h2 style="font-size:1.4rem">Turn the constraints off</h2>
      <p class="dim" style="max-width:62ch;margin:8px 0 18px;font-size:13.5px">
        Every case carries zero or more constraints. Toggle them and the board recomputes over exactly the cases
        that match — the fastest way to see what a model is actually bad at.</p>
      <div class="toggles" id="dl-tg"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
        <select id="dl-dir"><option value="">All directions</option>${META.directions.map((d) => `<option value="${d}">${dirLabel(d)}</option>`).join("")}</select>
        <button class="btn" id="dl-none">none</button><button class="btn" id="dl-all">all</button>
        <span class="dim mono" id="dl-n" style="font-size:12px"></span>
      </div>
      <div class="layout"><div class="scroll" id="dl-board"></div><div id="dl-side"></div></div></div>`;
    $("#dl-tg", root).innerHTML = META.challenges.map((c) => `
      <button class="tg" data-k="${c.key}" aria-pressed="true" title="${esc(c.desc)}">
        <span class="sw"><i></i></span><b class="mono" style="font-size:12px">${c.key}</b></button>`).join("");

    async function recompute() {
      const keys = [...on];
      const [df, dt] = dirSel ? dirSel.split(">") : [null, null];
      const subset = CASES.filter((c) =>
        (!dirSel || (c.from === df && c.to === dt)) &&
        (keys.length === META.challenges.length ? true
          : c.challenges.length === 0 ? keys.length === 0
          : c.challenges.every((x) => keys.includes(x)) && c.challenges.length > 0));
      $("#dl-n", root).textContent = `${subset.length} cases`;
      if (!subset.length) { $("#dl-board", root).innerHTML = '<p class="dim" style="font-size:13px">no cases match that combination</p>'; $("#dl-side", root).innerHTML = ""; return; }
      if (!loaded) { $("#dl-board", root).innerHTML = `<div class="load" id="dl-p">loading verdicts…</div>`;
        await loadAll((d, t) => { const p = $("#dl-p", root); if (p) p.textContent = `loading verdicts ${d}/${t}`; }); loaded = true; }
      const ids = subset.map((c) => c.id);
      const rows = await Promise.all(BOARD.map(async (m) => {
        const v = await loadModel(m.slug);
        let p = 0, e = 0, n = 0;
        for (const id of ids) { const r = v.get(id); if (!r) continue; n++; if (T(r.p)) p++; if (T(r.e)) e++; }
        return { m, plain: n ? Math.round(p / n * 100) : null, ex: n ? Math.round(e / n * 100) : null };
      }));
      rows.sort((a, b) => Math.max(b.ex ?? 0, b.plain ?? 0) - Math.max(a.ex ?? 0, a.plain ?? 0));
      $("#dl-board", root).innerHTML = `<table><thead><tr><th>#</th><th>model</th><th>size</th><th>plain</th><th>explained</th></tr></thead><tbody>
        ${rows.slice(0, 25).map((r, i) => `<tr><td class="mono dim">${i + 1}</td>
          <td>${esc(r.m.model)} <span class="dim mono" style="font-size:10.5px">${esc(r.m.provider)}</span></td>
          <td class="mono dim">${fmtSize(r.m)}</td>
          <td class="mono">${r.plain ?? "—"}</td>
          <td class="mono" style="font-weight:700;color:var(--accent)">${r.ex ?? "—"}</td></tr>`).join("")}
      </tbody></table>`;
      // how the field as a whole moves as constraints stack
      const tiers = [0, 1, 2, 3, 4, 5, 6, 7].map((k) => {
        const sub = CASES.filter((c) => c.challenges.length === k && (!dirSel || (c.from === df && c.to === dt)));
        return { k, n: sub.length };
      }).filter((t) => t.n >= 20);
      const tierScores = await Promise.all(tiers.map(async ({ k, n }) => {
        const sub = CASES.filter((c) => c.challenges.length === k && (!dirSel || (c.from === df && c.to === dt))).map((c) => c.id);
        let hit = 0, tot = 0;
        for (const m of BOARD) { const v = await loadModel(m.slug);
          for (const id of sub) { const r = v.get(id); if (!r) continue; tot++; if (T(r.p) || T(r.e)) hit++; } }
        return { k, n, v: tot ? hit / tot * 100 : 0 };
      }));
      $("#dl-side", root).innerHTML = `
        <div style="font:600 9.5px var(--mono);letter-spacing:.12em;opacity:.55;margin-bottom:10px">FIELD AVERAGE AS CONSTRAINTS STACK</div>
        <div style="display:flex;align-items:flex-end;gap:7px;height:180px;border-bottom:1px solid #16121c22">
          ${tierScores.map((t) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px" title="${t.n} cases">
            <span class="mono" style="font-size:10.5px">${t.v.toFixed(0)}</span>
            <div style="width:100%;height:${t.v * 1.4}px;background:var(--accent);opacity:.88;border-radius:3px 3px 0 0"></div>
            <span class="mono dim" style="font-size:10px">${t.k}</span></div>`).join("")}
        </div>
        <div class="dim mono" style="font-size:10px;margin-top:6px">number of constraints on the case →</div>`;
    }
    $$("#dl-tg .tg", root).forEach((b) => b.onclick = () => {
      const k = b.dataset.k; on.has(k) ? on.delete(k) : on.add(k);
      b.setAttribute("aria-pressed", String(on.has(k))); recompute();
    });
    $("#dl-none", root).onclick = () => { on.clear(); $$("#dl-tg .tg", root).forEach((b) => b.setAttribute("aria-pressed", "false")); recompute(); };
    $("#dl-all", root).onclick = () => { META.challenges.forEach((c) => on.add(c.key)); $$("#dl-tg .tg", root).forEach((b) => b.setAttribute("aria-pressed", "true")); recompute(); };
    $("#dl-dir", root).onchange = (e) => { dirSel = e.target.value; recompute(); };
    recompute();
  },
});

/* ─── 10 · Digest ─────────────────────────────────────────────────────── */
app({
  slug: "digest", name: "Digest",
  bg: "#f4f6fb", ink: "#0f1523", accent: "#2a78d6", font: "var(--sans)",
  css: `
    .a-digest .feed { max-width: 76ch; margin: 0 auto; display: flex; flex-direction: column; gap: 13px; }

  `,
  async mount(root) {

    const byEff = [...BOARD].filter((m) => m.params).sort((a, b) => best(b) / Math.log10(b.params) - best(a) / Math.log10(a.params));
    const gapModels = [...BOARD].map((m) => ({ m, g: m.plain.task - m.plain.strict })).sort((a, b) => b.g - a.g).filter((x) => x.g > 0);
    const enumGain = (BOARD.reduce((s, m) => s + (m.plain.noEnum - m.plain.task), 0) / BOARD.length).toFixed(1);
    const items = [
      { t: `${BOARD[0].model} leads at ${best(BOARD[0])} — and that is the ceiling`,
        d: `No model in the set clears ${best(BOARD[0])}/100. Every case is answered correctly by at least one model, but none is answered by all of them.`,
        ev: `<table><tbody>${BOARD.slice(0, 8).map((m, i) => `<tr><td class="mono dim">${i + 1}</td><td>${esc(m.model)}</td>
          <td class="mono">${fmtSize(m)}</td><td class="mono" style="color:var(--accent);font-weight:700">${best(m)}</td></tr>`).join("")}</tbody></table>` },
      { t: `The worked example helped ${helped} models and hurt ${hurt}`,
        d: `Prepending one solved example of the same conversion direction is supposed to be free accuracy. Across ${BOARD.length} models it is closer to a coin flip.`,
        ev: `<table><tbody>${[...BOARD].sort((a, b) => b.delta - a.delta).slice(0, 5).concat([...BOARD].sort((a, b) => a.delta - b.delta).slice(0, 5))
          .map((m) => `<tr><td>${esc(m.model)}</td><td class="mono">${m.plain.task} → ${m.ex.task}</td>
          <td class="mono" style="color:${m.delta > 0 ? "#1c8a5a" : "#b4433f"};font-weight:700">${m.delta > 0 ? "+" : ""}${m.delta}</td></tr>`).join("")}</tbody></table>` },
      { t: `${dirLabel(dirAvg[0].d)} is the hardest direction`,
        d: `At ${dirAvg[0].v.toFixed(0)} average against ${dirAvg.at(-1).v.toFixed(0)} for ${dirLabel(dirAvg.at(-1).d)}. CSV erases types, so converting out of it means reconstructing which cells were numbers, booleans, or strings that merely look numeric.`,
        ev: dirAvg.map(({ d, v }) => `<div style="display:flex;align-items:center;gap:9px;margin-bottom:4px">

          <span style="flex:1;height:8px;border-radius:3px;background:#0f152314"><span style="display:block;height:8px;border-radius:3px;width:${v}%;background:var(--accent)"></span></span>

      { t: `Size is a weak predictor`,
        d: `Ranked by score per order-of-magnitude of parameters, the most efficient models are nowhere near the largest.`,

          <td class="mono" style="color:var(--accent);font-weight:700">${best(m)}</td></tr>`).join("")}</tbody></table>` },
      ...(gapModels.length ? [{ t: `${gapModels.length} models know the answer but can't stop talking`,
        d: `These score much higher on task than on strict — they produce the right value, then wrap it in prose or code fences. ${esc(gapModels[0].m.model)} loses ${gapModels[0].g} points that way.`,
        ev: `<table><tbody>${gapModels.slice(0, 6).map(({ m, g }) => `<tr><td>${esc(m.model)}</td>
          <td class="mono">task ${m.plain.task}</td><td class="mono dim">strict ${m.plain.strict}</td>
          <td class="mono" style="color:#b4433f;font-weight:700">−${g}</td></tr>`).join("")}</tbody></table>` }] : []),
      { t: `Removing the enum constraint lifts every score by ${enumGain} points`,
        d: `The enum rule has targets that cannot be derived from its own instruction ("Pre-order" → "preorder", "clear" → "cleared"). On those cases the benchmark measures vocabulary guessing, so an enum-excluded score is published alongside.`,
        ev: `<table><tbody>${BOARD.slice(0, 6).map((m) => `<tr><td>${esc(m.model)}</td><td class="mono">${m.plain.task}</td>
          <td class="mono" style="color:var(--accent);font-weight:700">${m.plain.noEnum}</td>
          <td class="mono dim">+${m.plain.noEnum - m.plain.task}</td></tr>`).join("")}</tbody></table>` },
    ];
    root.innerHTML = `<div class="wrap">
      <div style="text-align:center;margin-bottom:26px">
        <div class="mono dim" style="font-size:10px;letter-spacing:.16em">FORMAT-BENCH DIGEST</div>
        <h2 style="font-size:1.7rem;margin-top:10px">The findings, not the table</h2>
        <p class="dim" style="font-size:13.5px;margin:8px auto 0;max-width:52ch">Each card states one conclusion. Open it for the numbers behind it.</p>
      </div>
      <div class="feed">${items.map((it, i) => `<details class="item" ${i < 2 ? "open" : ""}>
        <summary><h3>${it.t}</h3><p>${it.d}</p><span class="more">the evidence ↓</span></summary>
        <div class="ev">${it.ev}</div></details>`).join("")}</div></div>`;
  },
});

/* ══ boot + switcher ════════════════════════════════════════════════════ */
try {
  [META, BOARD, CASES] = await Promise.all(["meta", "board", "cases"].map((f) =>
    fetch(`data/${f}.json`).then((r) => { if (!r.ok) throw new Error(`${f}.json HTTP ${r.status}`); return r.json(); })));
} catch (e) {
  $("#boot").innerHTML = `could not load data: ${esc(e.message)}<br><br>serve the folder:<br><code>python3 -m http.server -d docs</code>`;
  throw e;
}
BYID = new Map(CASES.map((c) => [c.id, c]));
$("#boot").remove();
$("#app").hidden = false;
$("#bar").hidden = false;

const style = document.createElement("style");
style.textContent = APPS.map((a) => a.css ?? "").join("\n");
document.head.append(style);
$("#jump").innerHTML = APPS.map((a, i) => `<option value="${i}">${String(i + 1).padStart(2, "0")} — ${a.name}</option>`).join("");

let cur = -1;
async function show(i) {
  cur = (i + APPS.length) % APPS.length;
  const a = APPS[cur];
  const host = $("#app");
  host.innerHTML = "";
  host.classList.toggle("full", !!a.full);
  const root = el("div", { class: `ap a-${a.slug}` });
  root.style.cssText = `--bg:${a.bg};--ink:${a.ink};--accent:${a.accent};--font:${a.font}`;
  host.append(root);
  $("#count").textContent = `${String(cur + 1).padStart(2, "0")}/${String(APPS.length).padStart(2, "0")}`;
  $("#jump").value = String(cur);
  location.hash = a.slug;
  document.body.style.background = a.bg;
  scrollTo({ top: 0 });
  try { await a.mount(root); } catch (e) { root.innerHTML = `<div class="wrap"><p>this front-end failed to render: ${esc(e.message)}</p></div>`; console.error(e); }
}
$("#prev").onclick = () => show(cur - 1);
$("#next").onclick = () => show(cur + 1);
$("#jump").onchange = (e) => show(+e.target.value);
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") show(cur - 1);
  else if (e.key === "ArrowRight") show(cur + 1);
});
const start = APPS.findIndex((a) => a.slug === location.hash.slice(1));
show(start >= 0 ? start : 0);
</script>
</body>
